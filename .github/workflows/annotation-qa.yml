name: Annotation QA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/annotation-qa.yml"
      - "tests/**"
      - "tools/**"
      - "samples/video_action_annotation_practice.csv"
  push:
    branches:
      - feat/video-action-timeline-qa-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run repository unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate practice video-action annotations
        run: python tools/validate_video_action_timeline.py samples/video_action_annotation_practice.csv
